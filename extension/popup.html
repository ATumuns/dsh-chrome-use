<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH-Chrome-Use</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #101418;
        --muted: #5b6670;
        --line: #d8dee4;
        --ok: #1a7f37;
        --bad: #cf222e;
        --accent: #1f6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --fg: #e6edf3;
          --muted: #9198a1;
          --line: #30363d;
          --ok: #3fb950;
          --bad: #f85149;
          --accent: #4493f8;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      h1 { margin: 0 0 2px; font-size: 14px; letter-spacing: 0.01em; }
      .sub { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; }
      .state {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 11px; margin-bottom: 10px;
        border: 1px solid var(--line); border-radius: 8px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.bad { background: var(--bad); }
      #detail { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 12px; }
      .row { display: flex; gap: 8px; margin-bottom: 10px; }
      button {
        flex: 1; padding: 7px 10px; cursor: pointer;
        border: 1px solid var(--line); border-radius: 7px;
        background: transparent; color: var(--fg); font-size: 12.5px;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      dl { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; margin: 0 0 10px; font-size: 11.5px; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      .hint { margin: 0; color: var(--muted); font-size: 11px; }
      code { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 11px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>DSH-Chrome-Use</h1>
    <p class="sub">让 DeepSeek Harness 通过 CDP 操作这个浏览器</p>

    <div class="state">
      <span id="dot" class="dot"></span>
      <span id="detail">读取状态…</span>
    </div>

    <dl>
      <dt>桥接地址</dt>
      <dd><code id="endpoint">—</code></dd>
      <dt>本页标签</dt>
      <dd><code id="tabinfo">—</code></dd>
    </dl>

    <div class="row">
      <button id="connect" class="primary">连接</button>
      <button id="disconnect">断开</button>
    </div>
    <div class="row">
      <button id="options">设置与配对令牌</button>
    </div>

    <p class="hint">
      令牌由 DSH 的 <code>chrome_use_status</code> 工具输出；粘到设置页即可。<br />
      没有连上时先确认 DSH 正在运行。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
